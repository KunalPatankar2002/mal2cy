spring:
  application:
    name: mal2cy-sync
  datasource:
    url: jdbc:sqlite:./data/mal2cy.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  quartz:
    job-store-type: memory

app:
  auth:
    token-store-path: ./data/auth-tokens.json
  sync:
    cron: "0 0 0 * * *"  # Daily at midnight
    zone: "Asia/Calcutta"
    timeout-seconds: 300
    retry-attempts: 3
    conflict-resolution: last-write-wins  # or mal-bias, crunchyroll-bias
    watch-history-replay-hours: 48
  crunchyroll:
    base-url: https://www.crunchyroll.com
    auth-url: /auth/v1/token
    watchlist-url: /content/v2/discover/{accountId}/watchlist
    search-url: /content/v2/discover/search
    watch-history-url: /content/v2/{accountId}/watch-history
    watch-history-page-size: 150
    add-watchlist-url: /content/v2/{accountId}/watchlist
    remove-watchlist-url: /content/v2/{accountId}/watchlist/{contentId}
    device-type: Chrome on Chrome OS
    search-score-threshold: 120
    client-id: bm9haWhkZXZtXzZpeWcwYThsMHE6  # Base64 encoded
    # Android TV app client used for the one-time activation at crunchyroll.com/activate.
    # Unofficial; override with CRUNCHYROLL_TV_CLIENT_AUTH if Crunchyroll retires it.
    tv-client-auth: ${CRUNCHYROLL_TV_CLIENT_AUTH:ZXI5bmdnMmtvNW9oaXJsYTUxaTI6VmwxVDBQbjhRWko2d3o0NnhYRGxIekRGUDV0Wlgxb3E=}
    tv-user-agent: ${CRUNCHYROLL_TV_USER_AGENT:Crunchyroll/ANDROIDTV/3.76.0_22366 (Android 12; en-US; SHIELD Android TV Build/SR1A.220624.014)}
    device-code-url: /auth/v1/device/code
    device-token-url: /auth/v1/device/token
  mal:
    base-url: https://api.myanimelist.net/v2
    auth-url: https://myanimelist.net/v1/oauth2/authorize
    token-url: https://myanimelist.net/v1/oauth2/token
    redirect-uri: ${MAL_REDIRECT_URI:http://localhost:8080/auth/mal/callback}
    client-id: ${MAL_CLIENT_ID:}
    client-secret: ${MAL_CLIENT_SECRET:}
  jikan:
    base-url: https://api.jikan.moe/v4
  credentials:
    crunchyroll-device-id: ${CRUNCHYROLL_DEVICE_ID:}
    crunchyroll-etp-rt: ${CRUNCHYROLL_ETP_RT:}
    mal-access-token: ${MAL_ACCESS_TOKEN:}
    mal-refresh-token: ${MAL_REFRESH_TOKEN:}

logging:
  level:
    com.mal2cy: DEBUG
  file:
    name: ./logs/mal2cy.log

server:
  port: 8080
